name: Build Minecraft 1.21.3
on:
  push:
    paths: ['versions/1.21.3/**', '.github/workflows/build-1.21.3.yml']
  pull_request:
    paths: ['versions/1.21.3/**', '.github/workflows/build-1.21.3.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: versions/1.21.3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: day-counter-forge-1.21.3
          path: versions/1.21.3/build/libs/*.jar
          if-no-files-found: error
